name: Deploy QA report to GitHub Pages

# Publishes Test-result/ (which contains the self-contained index.html report) to GitHub Pages
# on every push to main, and on demand. Enable once: repo Settings → Pages → Build and
# deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'Test-result/**'
      - '.github/workflows/deploy-report.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload the report folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Test-result
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
